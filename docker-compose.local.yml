volumes:
  ojoalplato_local_postgres_data: {}
  ojoalplato_local_postgres_data_backups: {}
  ojoalplato_local_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: ojoalplato_local_django
    container_name: ojoalplato_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
    command: /start
    links:
      - postgres
      - redis
      - elasticsearch

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: ojoalplato_production_postgres
    container_name: ojoalplato_local_postgres
    volumes:
      - ojoalplato_local_postgres_data:/var/lib/postgresql/data
      - ojoalplato_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: ojoalplato_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:6
    container_name: ojoalplato_local_redis

    volumes:
      - ojoalplato_local_redis_data:/data


  celeryworker:
    <<: *django
    image: ojoalplato_local_celeryworker
    container_name: ojoalplato_local_celeryworker
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  #celerybeat:
  #  <<: *django
  #  image: ojoalplato_local_celerybeat
  #  container_name: ojoalplato_local_celerybeat
  #  depends_on:
  #    - redis
  #    - postgres
  #    - mailpit
  #  ports: []
  #  command: /start-celerybeat

  flower:
    <<: *django
    image: ojoalplato_local_flower
    container_name: ojoalplato_local_flower
    ports:
      - '5555:5555'
    command: /start-flower

  elasticsearch:
    image: elasticsearch:2.4.5
    hostname: elasticsearch
    environment:
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    ports:
      - 9200:9200
